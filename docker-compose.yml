version: '3.8'

services:
  backend:
    build: ./backend
    container_name: igrot-backend
    volumes:
      - ./backend:/app
      - ./data:/data
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: igrot-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
